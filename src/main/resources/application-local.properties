# Disable all shared-security auto-configurations for local development
spring.autoconfigure.exclude=
  edu.oconnor.sharedsecurity.config.SecurityConfig,
  edu.oconnor.sharedsecurity.config.WebSocketSecurityConfig,
  edu.oconnor.sharedsecurity.config.WebSocketSecurityAutoConfiguration,
  edu.oconnor.sharedsecurity.config.PlatformJwtAutoConfiguration
