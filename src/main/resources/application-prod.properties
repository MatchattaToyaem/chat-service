spring.application.name=chat-service
management.endpoint.health.probes.enabled=true
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true

server.port=8080

# Azure AD JWT issuer (set via environment variable from Key Vault)
spring.security.oauth2.resourceserver.jwt.issuer-uri=${JWT_ISSUER_URI}

# PostgreSQL datasource (set via environment variables)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Platform JWT validation (set via environment variables)
app.jwt.secret=${JWT_SECRET}

# gRPC client (set via environment variables)
grpc.client.chatbot-server.address=${CHATBOT_SERVER_ADDRESS}
grpc.client.chatbot-server.negotiation-type=tls

spring.docker.compose.enabled=false
